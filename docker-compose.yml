services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buhariy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
      POSTGRES_DB: buhariy
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buhariy -d buhariy']
      interval: 3s
      timeout: 3s
      retries: 20
  minio:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-buhariy-local}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: ['media_data:/data']
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  media_data:
